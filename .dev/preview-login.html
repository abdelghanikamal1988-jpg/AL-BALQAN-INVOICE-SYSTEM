<!doctype html>
<html lang="en">
  <head>
  <link rel="stylesheet" href="../dist/assets/index-C4OBoKFH.css" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Preview — login (Nexus gate)</title>
    <style>
      body { margin: 0; }
    </style>
  </head>
  <body>
    <div class="login-page">
      <div class="login-frame">
        <div class="login-brand">
          <span class="login-brand__tile">
            <img src="../public/logo.svg" alt="" />
          </span>
          <span class="login-brand__name">AL BALQAN</span>
        </div>

        <div class="card login-card">
          <span class="login-card__strip" aria-hidden="true"></span>
          <h1 class="login-card__title">Sign in to your account</h1>
          <p class="login-card__sub">Sign in with your work email.</p>

          <form class="login-form">
            <div class="field">
              <label for="pv-email">Email address</label>
              <input id="pv-email" type="email" autocomplete="username" placeholder="you@company.com" value="admin@albalqan.com" />
            </div>

            <div class="field">
              <label for="pv-password">Password</label>
              <input id="pv-password" type="password" autocomplete="current-password" placeholder="Your password" value="password" />
            </div>

            <button type="button" class="btn btn--primary btn--block">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 3.5H17a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2h-2.5" /><path d="M10 16.5l3.5-4.5L10 7.5" /><path d="M13.5 12H3.8" /></svg>
              Sign in
            </button>
          </form>

          <div class="login-card__hint">
            <p class="login-card__hint-title">Account access</p>
            <p class="login-card__hint-text">
              Invoices are stored securely in the cloud under this account.
              Use the work email and password your administrator gave you.
            </p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
