<!doctype html>
<html lang="en">
  <head>
  <link rel="stylesheet" href="../dist/assets/index-CjZ5UdAI.css" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Preview — shell layout</title>
    <style>
      body { margin: 0; }
      .app-shell { min-height: 100vh; }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <div class="app-shell__body">
        <aside class="sidebar no-print is-open" aria-label="Primary">
          <a href="#" class="sidebar__brand">
            <span class="sidebar__brand-logo">
              <img src="../public/logo.svg" alt="" />
            </span>
            <span class="sidebar__brand-name">AL BALQAN</span>
          </a>

          <nav class="sidebar__nav" aria-label="Sections">
            <div class="sidebar__nav-group">
              <a href="#" class="sidebar__link is-active" title="Dashboard">
                <span class="sidebar__icon">
                  <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3.5" y="3.5" width="7" height="7" rx="1.4" />
                    <rect x="13.5" y="3.5" width="7" height="7" rx="1.4" />
                    <rect x="3.5" y="13.5" width="7" height="7" rx="1.4" />
                    <rect x="13.5" y="13.5" width="7" height="7" rx="1.4" />
                  </svg>
                </span>
                <span class="sidebar__label">Dashboard</span>
              </a>
            </div>

            <div class="sidebar__nav-group">
              <p class="sidebar__group">Invoices</p>
              <a href="#" class="sidebar__link" title="New Invoice">
                <span class="sidebar__icon">
                  <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M13.5 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8.5z" />
                    <path d="M13.5 3v5.5H19" />
                    <path d="M12 12.5v5M9.5 15h5" />
                  </svg>
                </span>
                <span class="sidebar__label">New Invoice</span>
              </a>

              <a href="#" class="sidebar__link" title="Invoice History">
                <span class="sidebar__icon">
                  <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="8.2" />
                    <path d="M12 7.4V12l3 1.8" />
                  </svg>
                </span>
                <span class="sidebar__label">Invoice History</span>
              </a>
            </div>

            <div class="sidebar__nav-group">
              <p class="sidebar__group">Clients</p>
              <a href="#" class="sidebar__link" title="New Client">
                <span class="sidebar__icon">
                  <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14.5 20.5v-1.6a4 4 0 0 0-4-4H6.8a4 4 0 0 0-4 4v1.6" />
                    <circle cx="9.2" cy="7.6" r="3.6" />
                    <path d="M18.5 8.2v6M15.5 11.2h6" />
                  </svg>
                </span>
                <span class="sidebar__label">New Client</span>
              </a>

              <a href="#" class="sidebar__link" title="Clients History">
                <span class="sidebar__icon">
                  <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14.5 20.5v-1.6a4 4 0 0 0-4-4H6.3a4 4 0 0 0-4 4v1.6" />
                    <circle cx="8.4" cy="7.6" r="3.6" />
                    <path d="M17 4.4a3.6 3.6 0 0 1 0 6.4" />
                    <path d="M21.7 20.5v-1.6a4 4 0 0 0-3-3.8" />
                  </svg>
                </span>
                <span class="sidebar__label">Clients History</span>
              </a>
            </div>

            <div class="sidebar__nav-group">
              <p class="sidebar__group">Admin</p>
              <a href="#" class="sidebar__link" title="Users">
                <span class="sidebar__icon">
                  <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="9" cy="8" r="3.4" />
                    <path d="M3.5 19.5v-1.4a4 4 0 0 1 4-4h3a4 4 0 0 1 4 4v1.4" />
                    <path d="M17.5 8.5v5M15 11h5" />
                  </svg>
                </span>
                <span class="sidebar__label">Users</span>
              </a>
            </div>
          </nav>

          <div class="sidebar__foot">
            <button type="button" class="sidebar__link" title="Sign Out">
              <span class="sidebar__icon">
                <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M14.5 4H17a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-2.5" />
                  <path d="M9.5 8.2 6 12l3.5 3.8" />
                  <path d="M6 12h8.5" />
                </svg>
              </span>
              <span class="sidebar__label">Sign Out</span>
            </button>
          </div>
        </aside>

        <div class="app-shell__main">
          <header class="app-header no-print">
      <div class="app-header__inner">
        <button type="button" class="app-header__menu" aria-label="Close navigation" aria-expanded="true" aria-controls="app-sidebar">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></svg>
        </button>

        <a href="#" class="app-header__brand" aria-label="AL BALQAN home">
          <span class="app-header__logo">
            <img src="../public/logo.svg" alt="AL BALQAN logo" />
          </span>
          <span class="app-header__brand-word">AL BALQAN</span>
        </a>

        <form class="topsearch" role="search" onsubmit="return false;">
          <span class="topsearch__addon" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7.5"/><path d="M20.5 20.5l-4.4-4.4"/></svg></span>
          <input class="topsearch__input" type="search" placeholder="Search clients, invoices…" aria-label="Search" />
          <kbd class="topsearch__hint" aria-hidden="true">/</kbd>
        </form>

        <div class="app-header__right">
          <div class="app-header__dd">
            <button type="button" class="app-header__cta">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
              New
            </button>
          </div>

          <button type="button" class="app-header__tool app-header__tool--lang" title="Switch to Arabic" aria-label="Switch to Arabic">&#1593;</button>

          <button type="button" class="app-header__tool app-header__tool--theme" title="Switch to dark theme" aria-label="Switch to dark theme">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20.2 14.8A8.6 8.6 0 0 1 9.2 3.8a8.7 8.7 0 1 0 11 11z"/></svg>
          </button>

          <button type="button" class="app-header__tool app-header__tool--wide" title="Toggle fullscreen" aria-label="Toggle fullscreen">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 3.5H5.5a2 2 0 0 0-2 2v3"/><path d="M15.5 3.5h3a2 2 0 0 1 2 2v3"/><path d="M8.5 20.5H5.5a2 2 0 0 1-2-2v-3"/><path d="M15.5 20.5h3a2 2 0 0 0 2-2v-3"/></svg>
          </button>

          <button type="button" class="app-header__bell">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8.6a6 6 0 1 0-12 0c0 5.4-2.2 7-2.2 7h16.4s-2.2-1.6-2.2-7"/><path d="M13.8 19a2 2 0 0 1-3.6 0"/></svg>
            <span class="app-header__bell-count" aria-hidden="true">3</span>
          </button>

          <span class="app-header__vr" aria-hidden="true"></span>

          <div class="app-header__dd">
            <button type="button" class="app-header__user" aria-haspopup="menu" aria-expanded="false">
              <span class="app-header__avatar" title="admin@albalqan.com">MA</span>
              <span class="app-header__user-meta">
                <span class="app-header__uname">Maha Al Balqan</span>
                <span class="app-header__urole">Administrator</span>
              </span>
              <svg class="icon app-header__ucharv" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 9.5L12 16l6.5-6.5"/></svg>
            </button>
          </div>
        </div>
      </div>
    </header>

          <div class="page">
            <div class="page-header">
              <div>
                <p class="eyebrow">Dashboard</p>
                <h1>Dashboard</h1>
                <p class="subtitle">Layout check — sidebar rail, header inside main.</p>
              </div>
              <div class="page-header__right">
                <ul class="crumbs">
                  <li><a href="#">Home</a></li>
                  <li><span class="crumbs__cur">Dashboard</span></li>
                </ul>
                <button type="button" class="btn btn--primary">
                  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14" /><path d="M5 12h14" /></svg>
                  New Invoice
                </button>
              </div>
            </div>

            <div class="statc-row">
              <div class="statc">
                <span class="statc__tile statc__tile--green"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16v12H4z" /><path d="M4 11h16" /></svg></span>
                <span class="statc__text"><span class="statc__label">Total clients</span><span class="statc__value">128</span></span>
                <span class="statc__chev"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6" /></svg></span>
              </div>
              <div class="statc">
                <span class="statc__tile statc__tile--amber"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.2" /><path d="M12 7.4V12l3 1.8" /></svg></span>
                <span class="statc__text"><span class="statc__label">Pending</span><span class="statc__value">6</span></span>
                <span class="statc__chev"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6" /></svg></span>
              </div>
            </div>

            <div class="card">
              <div class="card__body">Content area…</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  
    <script>
      (function () {
        var aside = document.querySelector('aside.sidebar');
        var menu = document.querySelector('.app-header__menu');
        if (!aside || !menu) return;
        menu.addEventListener('click', function () {
          var open = aside.classList.toggle('is-open');
          menu.setAttribute('aria-expanded', String(open));
          menu.setAttribute('aria-label', open ? 'Close navigation' : 'Open navigation');
        });
      })();
    </script>
  </body>
</html>
