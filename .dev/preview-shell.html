<!doctype html>
<html lang="en">
  <head>
  <link rel="stylesheet" href="../dist/assets/index-Ci6lQISF.css" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Preview — shell layout</title>
    <style>
      body { margin: 0; }
      .app-shell { min-height: 100vh; }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header no-print">
        <div class="app-header__inner">
          <button type="button" class="app-header__menu" aria-label="Open navigation" aria-expanded="false">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16" /><path d="M4 12h16" /><path d="M4 17h16" /></svg>
          </button>

          <a href="#" class="app-header__brand" aria-label="AL BALQAN home">
            <span class="app-header__logo">
              <img src="../public/logo.png" alt="AL BALQAN logo" />
            </span>
          </a>

          <nav class="app-header__nav" aria-label="Primary">
            <a href="#" class="app-header__link is-active">Dashboard</a>
            <a href="#" class="app-header__link">New Invoice</a>
            <a href="#" class="app-header__link">Invoice History</a>
            <a href="#" class="app-header__link">Clients</a>
          </nav>

          <div class="app-header__right">
            <button type="button" class="app-header__bell">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8.6a6 6 0 1 0-12 0c0 5.4-2.2 7-2.2 7h16.4s-2.2-1.6-2.2-7" /><path d="M13.8 19a2 2 0 0 1-3.6 0" /></svg>
              <span class="app-header__bell-count" aria-hidden="true">3</span>
            </button>
            <span class="app-header__avatar" title="admin@albalqan.com">MA</span>
          </div>
        </div>
      </header>

      <div class="app-shell__body">
        <aside class="sidebar no-print" aria-label="Primary">
          <nav class="sidebar__nav" aria-label="Sections">
            <a href="#" class="sidebar__link is-active" title="Dashboard">
              <span class="sidebar__icon">
                <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3.5" y="3.5" width="7" height="7" rx="1.4" />
                  <rect x="13.5" y="3.5" width="7" height="7" rx="1.4" />
                  <rect x="3.5" y="13.5" width="7" height="7" rx="1.4" />
                  <rect x="13.5" y="13.5" width="7" height="7" rx="1.4" />
                </svg>
              </span>
              <span class="sidebar__label">Dashboard</span>
            </a>

            <a href="#" class="sidebar__link" title="New Invoice">
              <span class="sidebar__icon">
                <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M13.5 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8.5z" />
                  <path d="M13.5 3v5.5H19" />
                  <path d="M12 12.5v5M9.5 15h5" />
                </svg>
              </span>
              <span class="sidebar__label">New Invoice</span>
            </a>

            <a href="#" class="sidebar__link" title="Invoice History">
              <span class="sidebar__icon">
                <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="8.2" />
                  <path d="M12 7.4V12l3 1.8" />
                </svg>
              </span>
              <span class="sidebar__label">Invoice History</span>
            </a>

            <a href="#" class="sidebar__link" title="Clients">
              <span class="sidebar__icon">
                <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M14.5 20.5v-1.6a4 4 0 0 0-4-4H6.3a4 4 0 0 0-4 4v1.6" />
                  <circle cx="8.4" cy="7.6" r="3.6" />
                  <path d="M17 4.4a3.6 3.6 0 0 1 0 6.4" />
                  <path d="M21.7 20.5v-1.6a4 4 0 0 0-3-3.8" />
                </svg>
              </span>
              <span class="sidebar__label">Clients</span>
            </a>
          </nav>

          <div class="sidebar__foot">
            <button type="button" class="sidebar__link" title="Sign Out">
              <span class="sidebar__icon">
                <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M14.5 4H17a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-2.5" />
                  <path d="M9.5 8.2 6 12l3.5 3.8" />
                  <path d="M6 12h8.5" />
                </svg>
              </span>
              <span class="sidebar__label">Sign Out</span>
            </button>
          </div>
        </aside>

        <div class="app-shell__main">
          <div class="page">
            <div class="page-header">
              <div>
                <h1>Dashboard</h1>
                <p class="subtitle">Layout check — navbar on top, sidebar below it.</p>
              </div>
              <button type="button" class="btn btn--primary">+ New Invoice</button>
            </div>
            <div class="card">
              <div class="card__body">Content area…</div>
            </div>
          </div>
        </div>
      </div>
    </div>

</html>
